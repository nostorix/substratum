name: "Update flakes"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    permissions: 
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake.lock
        id: update_step
        run: |
          echo "Automated changes to \`flake.lock\`:" > pr_body.md
          echo "\`\`\`text" >> pr_body.md
          nix flake update 2>> pr_body.md
          echo "\`\`\`" >> pr_body.md
          
          if git diff --exit-code flake.lock > /dev/null; then
            echo "No changes detected."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            rm pr_body.md
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Signed Commit and PR
        if: steps.update_step.outputs.changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(flake): bump inputs"
          title: "chore(flake): bump inputs"
          body-path: pr_body.md
          branch: "update_flake_lock_action"
          labels: |
            auto-merge

      - name: Delete PR Body file
        if: always()
        run: rm -f pr_body.md

      - name: Enable GitHub Native Auto-Merge
        if: steps.update_step.outputs.changes == 'true' && steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.update.cpr.pull-request-url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
