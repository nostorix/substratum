name: "Update flakes"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          commit-msg: "chore(flake): bump inputs"
          pr-title: "chore(flake): bump inputs"
          git-author-name: "substratum-flake-updater[bot]"
          git-author-email: "314526475+substratum-flake-updater[bot]@users.noreply.github.com"
          git-committer-name: "substratum-flake-updater[bot]"
          git-committer-email: "314526475+substratum-flake-updater[bot]@users.noreply.github.com"
          token: ${{ steps.app-token.outputs.token }}
          pr-labels: |
            auto-merge

      - name: Enable GitHub Native Auto-Merge
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.update.outputs.pull-request-url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
