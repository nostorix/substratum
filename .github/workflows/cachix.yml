name: "CI Cachix Matrix Build"

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
  pull_request:
    paths:
      - 'packages/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.changed-pkgs.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Flake Health
        run: nix flake check --show-trace

      - name: Get changed packages
        id: changed-pkgs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
          else
            BASE_SHA="HEAD~1"
          fi

          CHANGED=$(git diff --name-only $BASE_SHA HEAD | \
            grep '^packages/' | \
            awk -F'/' '{print $2}' | \
            sort -u | xargs)

          echo "Detected changed packages: $CHANGED"
          echo "packages=$CHANGED" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: substratum
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run nix-fast-build
        run: |
          ARGS=()
          for pkg in ${{ needs.detect-changes.outputs.packages }}; do
            ARGS+=("-a" "packages.${{ matrix.system }}.$pkg")
          done

          nix run github:Mic92/nix-fast-build -- \
            --flake . \
            "${ARGS[@]}" \
            --skip-cached \
            --no-nom
