name: "apply nix fmt"

on:
  push:
    paths:
      - '*/**'
      - '!*'
      - '!.*'
      - '!.*/**'
  pull_request:
    paths:
      - '*/**'
      - '!*'
      - '!.*'
      - '!.*/**'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code
